is weekend","min":2,"why":"Rest you plan for actually happens."},{"id":"make-your-bed-into-a-cozy-spot","area":"Rest","t":"Make your bed into a cozy spot","min":5,"why":"A comfortable place makes resting easier."},{"id":"take-a-nap-under-30-minutes","area":"Rest","t":"Take a nap under 30 minutes","min":25,"why":"Short naps help many people feel refreshed without grogginess."},{"id":"notice-where-you-are-tense-and-soften-it","area":"Rest","t":"Notice where you are tense and soften it","min":2,"why":"Shoulders, jaw and hands hold more than we think."},{"id":"sit-outside-with-no-task","area":"Rest","t":"Sit outside with no task","min":10,"why":"Being somewhere without a goal is restful."},{"id":"turn-off-notifications-for-an-evening","area":"Rest","t":"Turn off notifications for an evening","min":1,"why":"A quieter phone makes a quieter evening."},{"id":"end-the-day-with-something-you-enjoy","area":"Rest","t":"End the day with something you enjoy","min":15,"why":"A gentle ending helps the day close."},{"id":"leave-one-task-for-tomorrow-on-purpose","area":"Rest","t":"Leave one task for tomorrow on purpose","min":1,"why":"Not everything has to happen today."},{"id":"listen-to-one-calm-song-with-eyes-closed","area":"Rest","t":"Listen to one calm song with eyes closed","min":4,"why":"Music can slow everything down for a few minutes."},{"id":"write-enough-for-today-and-mean-it","area":"Rest","t":"Write \"enough for today\" and mean it","min":1,"why":"Deciding you are done is part of resting."},{"id":"get-some-fresh-air-even-just-the-doorway","area":"Body","t":"Get some fresh air, even just the doorway","min":5,"why":"A change of air and light can lift your mood a little."},{"id":"step-outside-for-five-minutes","area":"Body","t":"Step outside for five minutes","min":5,"why":"Daylight helps your body keep its rhythm."},{"id":"drink-a-glass-of-water","area":"Body","t":"Drink a glass of water","min":1,"why":"Simple, and easy to forget."},{"id":"eat-something-with-a-little-prote up over a week."},{"id":"play-a-song-you-loved-at-14","area":"Joy","t":"Play a song you loved at 14","min":4,"why":"Nostalgia can bring a lift."},{"id":"make-something-with-your-hands","area":"Joy","t":"Make something with your hands","min":15,"why":"Making things feels good in a different way."},{"id":"look-at-photos-that-make-you-smile","area":"Joy","t":"Look at photos that make you smile","min":3,"why":"Good memories are worth revisiting."},{"id":"try-a-new-snack","area":"Joy","t":"Try a new snack","min":5,"why":"Novelty in small doses is fun."},{"id":"watch-something-funny","area":"Joy","t":"Watch something funny","min":10,"why":"Laughter is a quick mood shift."},{"id":"water-a-plant-or-get-one","area":"Joy","t":"Water a plant or get one","min":2,"why":"Caring for something small feels good."},{"id":"plan-one-thing-to-look-forward-to","area":"Joy","t":"Plan one thing to look forward to","min":3,"why":"Anticipation is its own kind of joy."},{"id":"wear-something-that-makes-you-feel-good","area":"Joy","t":"Wear something that makes you feel good","min":2,"why":"Small boosts count."},{"id":"spend-five-minutes-with-a-pet","area":"Joy","t":"Spend five minutes with a pet","min":5,"why":"Animals are good company."},{"id":"cook-something-simple-you-like","area":"Joy","t":"Cook something simple you like","min":20,"why":"Making food for yourself is a kind of care."},{"id":"rearrange-one-corner-of-your-room","area":"Joy","t":"Rearrange one corner of your room","min":10,"why":"A small change can make a space feel new."},{"id":"learn-one-new-fact-about-something-you-love","area":"Joy","t":"Learn one new fact about something you love","min":5,"why":"Curiosity is fun."},{"id":"take-a-photo-of-something-beautiful","area":"Joy","t":"Take a photo of something beautiful","min":2,"why":"Looking for beauty helps you find it."},{"id":"draw-something-badly-on-purpose","area":"Joy","t":"Draw something badly on purpose","min":3,"why":"No pressure, just play."},{"id":"watch-the-sunrise-or-sunset","area":"Joy","t":"Watch the sunrise or sunset","min":10,"why":"A slow, free show every day."},{"id":"read-a-comfort-book-again","area":"Joy","t":"Read a comfort book again","min":15,"why":"Familiar stories feel safe."},{"id":"send-a-voice-note-to-a-friend","area":"Joy","t":"Send a voice note to a friend","min":2,"why":"Hearing a voice feels closer than text."}],"guides":[{"id":"what-peer-support-is-and-isn-t","t":"What peer support is, and isn't","cat":"Start here","body":["Peer support means talking with people who have been through something similar. It can help you feel understood, less alone, and more hopeful.","Soothe circles are not therapy, and members and mentors are not clinicians. Nobody here will diagnose you or tell you what medication to take.","If you are thinking about hurting yourself or you are in danger, please reach a real person now: call or text 988 in the US, or call 911."]},{"id":"how-to-post-for-the-first-time","t":"How to post for the first time","cat":"Start here","body":["You can read any circle without joining. Nobody is notified.","When you are ready, start small: a check-in, an \"I relate\", or a short post. Posts are anonymous by default.","Add a content note if your post touches on something heavy, so others can choose when to read it."]},{"id":"circle-guidelines","t":"Circle guidelines","cat":"Start here","body":["Be kind. Share from your own experience instead of giving orders.","No diagnosing, no medical advice, and no numbers about weight, food or self-harm.","Keep what people share inside the circle. Report anything that worries you. Moderators review every report."]},{"id":"your-first-counseling-appointment","t":"Your first counseling appointment","cat":"Getting support","body":["Most campus counseling centers start with a short intake. You answer some questions about what brings you in and what you are hoping for.","You do not need the right words. \"I have been stressed and I am not sure why\" is a complete reason to go.","It is okay to ask questions: how sessions work, how often you can come, and what happens to your information."]},{"id":"how-to-find-a-therapist-who-fits","t":"How to find a therapist who fits","cat":"Getting support","body":["Look for someone who works with what you are going through. Directories let you filter by issue, cost and whether they take your insurance.","A short first call is normal. Ask how they work and whether they have experience with people like you.","Fit matters. If it is not working after a few sessions, it is okay to try someone else."]},{"id":"support-while-you-re-on-a-waitlist","t":"Support while you're on a waitlist","cat":"Getting support","body":["Waiting can feel long. Keep a short list of what you want to talk about so the first session feels easier to start.","Lean on low-effort supports in the meantime: small steps, a circle, a peer mentor and people you trust.","If things get worse while you wait, contact the counseling center again or reach 988."]},{"id":"talking-to-parents-who-don-t-believe-in-therapy","t":"Talking to parents who don't believe in therapy","cat":"Family","body":["Start with what you are feeling rather than the word \"therapy\": \"I have been really stressed and it is affecting my sleep.\"","Share what you want, not just what is wrong: \"I want to talk to someone who can help me handle it.\"","You may not get full understanding right away. Many campus services are free and confidential for students. Check your school's policies."]},{"id":"how-to-support-a-friend-who-is-struggling","t":"How to support a friend who is struggling","cat":"Helping others","body":["Listen more than you advise. \"That sounds really hard\" is often more helpful than a solution.","Ask directly if you are worried about their safety. Asking does not put the idea in their head.","You do not have to carry it alone. Help them connect with counseling, and reach 988 together if they are in crisis."]},{"id":"asking-for-academic-accommodations","t":"Asking for academic accommodations","cat":"School","body":["Most schools have a disability or accessibility office that handles accommodations for physical and mental health conditions.","You usually need documentation from a provider. Ask the office what they accept before your appointment.","Accommodations can include extended time, flexible deadlines or a quieter testing room."]},{"id":"emailing-a-professor-when-you-re-struggling","t":"Emailing a professor when you're struggling","cat":"School","body":["Keep it short. Say you are dealing with a personal or health issue, and you do not have to share details.","Ask for something specific: an extension, a meeting or a missed-class plan.","Send it before the deadline when you can. Most professors respond better to early notice."]},{"id":"making-friends-after-you-move","t":"Making friends after you move","cat":"Connection","body":["Repeated, low-pressure contact builds friendship. Go back to the same club, class or coffee shop.","Suggest one small, specific plan: \"Want to study Thursday at 4?\"","It often takes months. Feeling lonely while you build a new circle is normal."]},{"id":"when-grief-hits-on-hard-dates","t":"When grief hits on hard dates","cat":"Grief","body":["Plan the day ahead of time. Decide whether you want company or quiet.","Create a small ritual: a meal, a song or a walk somewhere meaningful.","Let people know it is a hard day, even if you do not want to talk about it."]},{"id":"grounding-when-your-mind-is-racing","t":"Grounding when your mind is racing","cat":"Calm","body":["Try 5-4-3-2-1: five things you see, four you can touch, three you hear, two you smell, one you taste.","Slow your breath: in for four, out for six, a few times.","Press your feet into the floor and notice the ground holding you up."]},{"id":"sleep-habits-that-fit-a-student-schedule","t":"Sleep habits that fit a student schedule","cat":"Sleep","body":["Aim for a steady wake-up time, even on weekends, as best you can.","Give yourself a short wind-down: dim lights, a paper book, the same small routine.","If worries keep you up, write them down before bed and put them in the Worry jar."]},{"id":"setting-boundaries-without-guilt","t":"Setting boundaries without guilt","cat":"Relationships","body":["A boundary is about what you will do, not what others must do: \"I am not available to talk after 10pm.\"","Keep it short and kind. You do not owe a long explanation.","Expect some discomfort the first few times. It usually gets easier."]},{"id":"taking-care-of-yourself-as-a-caregiver","t":"Taking care of yourself as a caregiver","cat":"Caregiving","body":["Your needs still matter. Rest makes you a steadier caregiver, not a worse one.","Make a list of small ways others can help, so you have an answer when they ask.","Look into respite care and local caregiver programs. Many communities have them."]}],"resources":{"urgent":[{"name":"988 Suicide & Crisis Lifeline","how":"Call or text 988","note":"Free, confidential, 24/7 in the US","url":"https://988lifeline.org"},{"name":"Crisis Text Line","how":"Text HOME to 741741","note":"Text with a trained crisis counselor, 24/7","url":"https://www.crisistextline.org"},{"name":"Emergency services","how":"Call 911","note":"If you or someone else is in immediate danger","url":""}],"more":[{"name":"SAMHSA National Helpline","how":"1-800-662-4357","note":"Free, confidential treatment referral and information, 24/7, English and Spanish","url":"https://www.samhsa.gov/find-help/helplines/national-helpline"},{"name":"National Alliance for Eating Disorders Helpline","how":"(866) 662-1235","note":"Weekdays 9am to 7pm ET. Referrals and support, not a crisis line","url":"https://www.allianceforeatingdisorders.com"},{"name":"The Trevor Project","how":"See their site for phone, text and chat","note":"Crisis support for LGBTQ+ young people","url":"https://www.thetrevorproject.org"},{"name":"Trans Lifeline","how":"See their site for current hotline hours","note":"Peer support run by and for trans people","url":"https://translifeline.org"},{"name":"RAINN","how":"See their site for phone and online chat","note":"Support after sexual assault, 24/7","url":"https://www.rainn.org"},{"name":"National Domestic Violence Hotline","how":"See their site for phone, text and chat","note":"Confidential support for anyone affected by abuse","url":"https://www.thehotline.org"},{"name":"NAMI HelpLine","how":"See their site for phone, text and chat","note":"Information, resources and support for mental health","url":"https://www.nami.org"},{"name":"FindTreatment.gov","how":"Search online","note":"Find mental health and substance use treatment near you","url":"https://findtreatment.gov"}],"campus":[{"name":"U-M CAPS counseling","how":"734-764-8312","note":"Free for U-M students. Book a first consultation by phone, the patient portal, or at the CAPS office in the Michigan Union.","url":"https://uhc.umich.edu/how-get-care"},{"name":"CAPS 24/7 counselor line","how":"734-764-8312","note":"Counselor advice at no cost, any time, including nights and weekends.","url":"https://uhc.umich.edu/how-get-care"},{"name":"U-M Psychiatric Emergency Service","how":"734-936-5900","note":"For psychiatric emergencies. In immediate danger, call 911.","url":"https://uhc.umich.edu/"},{"name":"Services for Students with Disabilities","how":"(734) 763-3000","note":"Request academic accommodations, starting with the initial contact form.","url":"https://studentaccessibility.umich.edu/applying-for-accommodations"}]},"reflections":{"stress":[{"q":"What's one thing you're letting be 'good enough' this week?","a":[{"who":"Anonymous","text":"My notes. They're messy but I can read them, and that's the point.","relate":14},{"who":"J.","text":"Dinner. Cereal counts. I'm done feeling bad about it.","relate":9},{"who":"Anonymous","text":"My reply to a group chat I've been avoiding. I sent two lines instead of a perfect paragraph.","relate":11},{"who":"M.","text":"The gym. I walked instead of running and it still felt like something.","relate":6}]},{"q":"When did you last feel even a little rested? What was different?","a":[{"who":"Anonymous","text":"Saturday morning before I checked my phone. Nobody needed anything from me yet.","relate":12},{"who":"K.","text":"On the bus home with headphones in. Twenty minutes where I couldn't do anything else.","relate":8},{"who":"Anonymous","text":"Honestly I can't remember. Reading these is reminding me to plan one.","relate":15},{"who":"T.","text":"After I said no to an extra shift. The relief was almost physical.","relate":10}]},{"q":"What's one thing on your list that could wait until next week?","a":[{"who":"Anonymous","text":"Reorganizing my desk. I keep thinking I'll be calmer after, but it can wait.","relate":7},{"who":"R.","text":"Answering the club email. It isn't urgent, it just feels loud.","relate":9},{"who":"Anonymous","text":"The reading for the class I'm already ahead in.","relate":5},{"who":"L.","text":"Calling the bank. It'll be the same problem on Monday.","relate":6}]}],"anxiety":[{"q":"What's a worry that turned out smaller than you expected?","a":[{"who":"Anonymous","text":"I was sure my professor was annoyed with me. She just replied 'no problem!'","relate":16},{"who":"S.","text":"The doctor's appointment. I spiraled for a week and it took ten minutes.","relate":12},{"who":"Anonymous","text":"Asking for an extension. I rehearsed it for days and they said yes in one line.","relate":14},{"who":"D.","text":"Calling to cancel a subscription. Still hate phone calls, but I survived it.","relate":9}]},{"q":"What helps you come back to the present when your mind races?","a":[{"who":"Anonymous","text":"Naming five blue things in the room. It feels silly and it works.","relate":18},{"who":"P.","text":"Cold water on my wrists, then one slow breath out.","relate":11},{"who":"Anonymous","text":"Texting someone 'can you talk about anything else for 5 min'.","relate":13},{"who":"E.","text":"Walking without headphones and listening to what's actually around me.","relate":8}]},{"q":"What would you tell a friend who had your exact worry this week?","a":[{"who":"Anonymous","text":"That one bad presentation doesn't define how people see you. I'd believe it for them.","relate":15},{"who":"A.","text":"'You're allowed to ask for help, it's not a burden.' Working on saying it to myself.","relate":12},{"who":"Anonymous","text":"That they did what they could with what they knew at the time.","relate":10},{"who":"C.","text":"I'd tell them to sleep first and decide tomorrow.","relate":7}]}],"mood":[{"q":"What's one small thing that got you through a heavy day?","a":[{"who":"Anonymous","text":"My cat sitting on my laptop so I had to stop.","relate":17},{"who":"B.","text":"A song I've loved since high school, on repeat.","relate":9},{"who":"Anonymous","text":"Showering, even though it took until 4pm. It still counted.","relate":14},{"who":"N.","text":"A friend who sent a meme without needing a reply.","relate":11}]},{"q":"What does a 'slightly better' day look like for you right now?","a":[{"who":"Anonymous","text":"Getting outside once, even just to the mailbox.","relate":12},{"who":"V.","text":"Eating something warm and answering one message.","relate":10},{"who":"Anonymous","text":"Not cancelling the one plan I made.","relate":8},{"who":"G.","text":"Opening the curtains in the morning instead of at night.","relate":9}]},{"q":"Who or what reminded you that you matter this week?","a":[{"who":"Anonymous","text":"My little sister asking me to help with her homework. She asked for me specifically.","relate":13},{"who":"H.","text":"A coworker who noticed I was quiet and checked in.","relate":10},{"who":"Anonymous","text":"Honestly, this circle. People remembered my post from last week.","relate":16},{"who":"O.","text":"My plant actually growing. I kept it alive.","relate":7}]}],"grief":[{"q":"What's a memory of them that made you smile this week?","a":[{"who":"Anonymous","text":"Mom singing badly in the car. I heard the song in a store and laughed out loud.","relate":19},{"who":"W.","text":"His terrible puns. My brother used one at dinner and we both teared up.","relate":14},{"who":"Anonymous","text":"Her handwriting on an old birthday card I found.","relate":12},{"who":"F.","text":"Grandpa insisting every dog he met was the best dog.","relate":11}]},{"q":"How are you carrying them with you right now?","a":[{"who":"Anonymous","text":"I wear his watch. It doesn't keep time well, I don't care.","relate":15},{"who":"Y.","text":"I make her recipe on Sundays even when it doesn't come out right.","relate":13},{"who":"Anonymous","text":"I say goodnight to the photo. It felt weird at first.","relate":10},{"who":"I.","text":"I'm trying to be as patient with people as she was.","relate":9}]},{"q":"What's something about grief you wish more people understood?","a":[{"who":"Anonymous","text":"That it doesn't get smaller, you just grow around it.","relate":18},{"who":"Q.","text":"That the second year can be harder than the first.","relate":12},{"who":"Anonymous","text":"That laughing doesn't mean I'm over it.","relate":14},{"who":"Z.","text":"That I still want to hear their name. Please say it.","relate":16}]}],"lonely":[{"q":"What's one small moment of connection you had this week, even with a stranger?","a":[{"who":"Anonymous","text":"The barista remembered my order. Small, but I thought about it all day.","relate":15},{"who":"J.","text":"Someone in my lab asked if I wanted to get lunch. I said yes.","relate":12},{"who":"Anonymous","text":"A dog owner let me pet their dog for way too long.","relate":11},{"who":"K.","text":"I commented on a post here and someone replied 'same'.","relate":9}]},{"q":"Where do you feel most like yourself?","a":[{"who":"Anonymous","text":"The library's top floor at night.","relate":10},{"who":"M.","text":"On a long drive with the windows down.","relate":8},{"who":"Anonymous","text":"Cooking for other people, which is funny because I rarely have anyone to cook for.","relate":12},{"who":"T.","text":"At my old job, weirdly. I'm trying to figure out what made it feel that way.","relate":7}]},{"q":"What's one low-pressure way you could reach out this week?","a":[{"who":"Anonymous","text":"Send an old friend a photo that reminded me of them.","relate":13},{"who":"R.","text":"Go to the board game night. I can leave after 30 minutes.","relate":11},{"who":"Anonymous","text":"Reply to the group chat instead of just reading it.","relate":9},{"who":"L.","text":"Ask my neighbor how her garden is doing.","relate":6}]}],"relationships":[{"q":"What's one thing you're learning about what you need in a relationship?","a":[{"who":"Anonymous","text":"That I need someone who texts back. It's not 'too much' to want that.","relate":16},{"who":"S.","text":"That quiet time together counts as quality time for me.","relate":9},{"who":"Anonymous","text":"That I'm allowed to bring things up before they become big.","relate":12},{"who":"D.","text":"That I'd rather be alone than keep shrinking myself.","relate":14}]},{"q":"What helped on a day you really missed someone?","a":[{"who":"Anonymous","text":"Letting myself miss them instead of fighting it. It passed faster.","relate":13},{"who":"P.","text":"Muting their account so I wasn't checking every hour.","relate":11},{"who":"Anonymous","text":"Calling my best friend and talking about literally anything else.","relate":10},{"who":"E.","text":"Writing a letter I'll never send.","relate":12}]},{"q":"What's a boundary you held (or want to hold) this week?","a":[{"who":"Anonymous","text":"Not answering texts after 11. I'm a better friend in the morning.","relate":12},{"who":"A.","text":"Telling my partner I need a heads-up before plans change.","relate":9},{"who":"Anonymous","text":"Not explaining myself three times. I said it once.","relate":14},{"who":"C.","text":"Leaving the party when I was done, without a reason.","relate":8}]}],"family":[{"q":"What's something you wish your family understood about you?","a":[{"who":"Anonymous","text":"That needing space isn't me rejecting them.","relate":17},{"who":"B.","text":"That my major isn't a phase.","relate":11},{"who":"Anonymous","text":"That I can be grateful and still hurt by things they said.","relate":15},{"who":"N.","text":"That 'just pray about it' isn't the same as listening.","relate":9}]},{"q":"How did you take care of yourself around family this week?","a":[{"who":"Anonymous","text":"I planned a walk halfway through the visit.","relate":12},{"who":"V.","text":"I had a friend text me at 8pm so I had a reason to step out.","relate":10},{"who":"Anonymous","text":"I let one comment go instead of arguing all night.","relate":9},{"who":"G.","text":"I didn't go home this weekend, and I'm okay with it.","relate":11}]},{"q":"Who outside your family has felt like family lately?","a":[{"who":"Anonymous","text":"My roommate, who makes extra rice 'by accident' every night.","relate":15},{"who":"H.","text":"My coach. She asks how I'm actually doing.","relate":10},{"who":"Anonymous","text":"My friend's mom, who adopted me for holidays.","relate":13},{"who":"O.","text":"People in this circle, honestly.","relate":12}]}],"care":[{"q":"What's one thing you did for yourself this week, not for the person you care for?","a":[{"who":"Anonymous","text":"A 20-minute nap I didn't apologize for.","relate":14},{"who":"W.","text":"Coffee with a friend while my brother covered for an hour.","relate":11},{"who":"Anonymous","text":"I sat in the car and listened to a whole album.","relate":12},{"who":"F.","text":"Nothing yet. This is my reminder to do one thing.","relate":9}]},{"q":"What's something people don't see about caregiving?","a":[{"who":"Anonymous","text":"How much planning goes into a 'simple' outing.","relate":13},{"who":"Y.","text":"That you can love someone and still feel resentful some days.","relate":16},{"who":"Anonymous","text":"The phone calls. So many phone calls.","relate":10},{"who":"I.","text":"That I'm grieving someone who's still here.","relate":15}]},{"q":"Who has helped share the load lately?","a":[{"who":"Anonymous","text":"My aunt took a weekend so I could sleep.","relate":11},{"who":"Q.","text":"A neighbor who brings soup without asking.","relate":9},{"who":"Anonymous","text":"Honestly no one, which is why I joined here.","relate":12},{"who":"Z.","text":"My dad's nurse, who explains things to me like I'm a person.","relate":10}]}],"health":[{"q":"What's one way you were kind to your body this week?","a":[{"who":"Anonymous","text":"Went to bed when I was tired instead of pushing through.","relate":12},{"who":"J.","text":"Ate breakfast. I keep skipping it.","relate":9},{"who":"Anonymous","text":"Stretched for five minutes and didn't judge how stiff I was.","relate":10},{"who":"K.","text":"Went to the appointment I'd been putting off.","relate":14}]},{"q":"What's something about your health you've stopped apologizing for?","a":[{"who":"Anonymous","text":"Needing to sit down. My body, my rules.","relate":15},{"who":"M.","text":"Leaving early when I'm in pain.","relate":13},{"who":"Anonymous","text":"Asking for the elevator.","relate":11},{"who":"T.","text":"Not drinking at parties.","relate":8}]},{"q":"What has helped you feel more in control of your health?","a":[{"who":"Anonymous","text":"Keeping a short symptom log. Doctors listen more when I have it.","relate":14},{"who":"R.","text":"Bringing a friend to appointments to take notes.","relate":10},{"who":"Anonymous","text":"Learning which questions to ask before I walk in.","relate":12},{"who":"L.","text":"Setting phone reminders for meds.","relate":7}]}],"school":[{"q":"What's one thing you got done this week that you're proud of, even if it was small?","a":[{"who":"Anonymous","text":"Started the paper. Just the intro, but it exists now.","relate":16},{"who":"S.","text":"Went to office hours for the first time.","relate":14},{"who":"Anonymous","text":"Turned in a lab that was 'fine'. Fine is good.","relate":11},{"who":"D.","text":"Studied with a group instead of alone.","relate":9}]},{"q":"How do you know it's time to stop studying for the night?","a":[{"who":"Anonymous","text":"When I've read the same paragraph three times.","relate":18},{"who":"P.","text":"When I start rewriting notes that are already fine.","relate":12},{"who":"Anonymous","text":"I set a hard stop at 11 and I'm trying to respect it.","relate":13},{"who":"E.","text":"When my shoulders are up by my ears.","relate":10}]},{"q":"What's one grade or deadline you're trying to see in perspective?","a":[{"who":"Anonymous","text":"A B on a midterm. It's one exam, not my whole future.","relate":15},{"who":"A.","text":"A missed quiz. I emailed the professor and it's handled.","relate":9},{"who":"Anonymous","text":"Orgo. Everyone I know struggled and they're fine.","relate":12},{"who":"C.","text":"My GPA from first semester. I'm not that person anymore.","relate":14}]}],"identity":[{"q":"Where have you felt like you belong lately?","a":[{"who":"Anonymous","text":"A student org I almost didn't go to.","relate":13},{"who":"B.","text":"Cooking with my grandma, even when we can't fully understand each other.","relate":15},{"who":"Anonymous","text":"Here, honestly.","relate":11},{"who":"N.","text":"A group chat of people from my hometown at different schools.","relate":9}]},{"q":"What's a part of yourself you've been more open about?","a":[{"who":"Anonymous","text":"Being first-gen. I used to hide it.","relate":16},{"who":"V.","text":"Talking about my faith with friends who don't share it.","relate":10},{"who":"Anonymous","text":"My accent. I stopped trying to flatten it.","relate":14},{"who":"G.","text":"That I don't know yet, and that's allowed.","relate":12}]},{"q":"Who's someone that made you feel seen this week?","a":[{"who":"Anonymous","text":"A professor who pronounced my name right the first time.","relate":17},{"who":"H.","text":"A friend who asked about my holiday instead of assuming.","relate":11},{"who":"Anonymous","text":"My roommate, who just listened.","relate":10},{"who":"O.","text":"A stranger here who said 'I've been there too'.","relate":13}]}],"change":[{"q":"What's one thing that's starting to feel familiar in a new place?","a":[{"who":"Anonymous","text":"The walk to class. I don't need maps anymore.","relate":13},{"who":"W.","text":"A coffee shop where they know my face.","relate":11},{"who":"Anonymous","text":"My room finally looks like mine.","relate":9},{"who":"F.","text":"Nothing yet, but I'm noticing more each week.","relate":10}]},{"q":"What are you missing from before, and what are you glad you left?","a":[{"who":"Anonymous","text":"Miss my friends. Glad I left the version of me who never said what she thought.","relate":15},{"who":"Y.","text":"Miss home cooking. Glad to be somewhere no one knew me in 8th grade.","relate":12},{"who":"Anonymous","text":"Miss my old routine. Glad I left the job that made me dread Sundays.","relate":13},{"who":"I.","text":"Miss my dog. That's it, that's the post.","relate":16}]},{"q":"What's helping you adjust, even a little?","a":[{"who":"Anonymous","text":"Saying yes to one invitation a week.","relate":12},{"who":"Q.","text":"Calling home on the same day each week so I have something to look forward to.","relate":11},{"who":"Anonymous","text":"Giving myself a full semester before judging this place.","relate":14},{"who":"Z.","text":"A walk at sunset. Same time, same loop.","relate":8}]}],"work":[{"q":"What's one money or work worry you put down this week?","a":[{"who":"Anonymous","text":"I made a budget, which made the problem real but also smaller.","relate":13},{"who":"J.","text":"I asked my manager about hours instead of guessing.","relate":11},{"who":"Anonymous","text":"I stopped checking my bank app five times a day.","relate":12},{"who":"K.","text":"Nothing yet. Writing it here helps.","relate":8}]},{"q":"How do you switch off after a hard shift?","a":[{"who":"Anonymous","text":"Change clothes immediately. Work clothes off, work brain off.","relate":14},{"who":"M.","text":"Music in the car before I go inside.","relate":10},{"who":"Anonymous","text":"I don't, really. Looking for ideas.","relate":9},{"who":"T.","text":"A snack and one episode of something dumb.","relate":11}]},{"q":"What's something you're good at that your job doesn't see?","a":[{"who":"Anonymous","text":"Calming people down. I'm the one my friends call.","relate":13},{"who":"R.","text":"Drawing. I haven't in months, but I'm good at it.","relate":10},{"who":"Anonymous","text":"Organizing chaos. My apartment, my friend's moving day, all of it.","relate":9},{"who":"L.","text":"Teaching. I explain things well when no one's rushing me.","relate":12}]}],"recovery":[{"q":"What's one choice this week that future-you will thank you for?","a":[{"who":"Anonymous","text":"Going to the meeting when I really didn't want to.","relate":17},{"who":"S.","text":"Telling a friend the truth instead of 'I'm fine'.","relate":14},{"who":"Anonymous","text":"Leaving early before things got hard.","relate":12},{"who":"D.","text":"Sleeping instead of scrolling.","relate":9}]},{"q":"What fills the time that the old habit used to take?","a":[{"who":"Anonymous","text":"Running. Badly, slowly, but every day.","relate":14},{"who":"P.","text":"Cooking new recipes. I'm actually decent now.","relate":11},{"who":"Anonymous","text":"Calling my sponsor more than I thought I would.","relate":12},{"who":"E.","text":"Puzzles. I have a whole table now.","relate":10}]},{"q":"What would you tell yourself on day one?","a":[{"who":"Anonymous","text":"That the hard days don't erase the good ones.","relate":18},{"who":"A.","text":"That asking for help isn't failing.","relate":15},{"who":"Anonymous","text":"That you'll laugh again. Really laugh.","relate":16},{"who":"C.","text":"That one step is enough.","relate":12}]}],"parents":[{"q":"What's a parenting moment this week that went better than you expected?","a":[{"who":"Anonymous","text":"Bedtime took 20 minutes instead of an hour. I'll take it.","relate":14},{"who":"B.","text":"My kid apologized to her brother without me asking.","relate":12},{"who":"Anonymous","text":"I stayed calm during a meltdown. First time in a while.","relate":16},{"who":"N.","text":"We laughed through a mess instead of yelling.","relate":11}]},{"q":"How do you find a few minutes for yourself?","a":[{"who":"Anonymous","text":"Five minutes in the car before I walk in the door.","relate":15},{"who":"V.","text":"Coffee before anyone wakes up.","relate":12},{"who":"Anonymous","text":"Bath time is my phone time. Don't judge.","relate":10},{"who":"G.","text":"I don't, which is something I'm working on.","relate":9}]},{"q":"What's one thing you're letting go of trying to be perfect at?","a":[{"who":"Anonymous","text":"Homemade lunches. Store-bought is fine.","relate":13},{"who":"H.","text":"A spotless house. Clean enough is fine.","relate":11},{"who":"Anonymous","text":"Screen time rules on sick days.","relate":10},{"who":"O.","text":"Comparing myself to other parents online.","relate":15}]}],"trauma":[{"q":"What helped you feel even a little safer this week?","a":[{"who":"Anonymous","text":"Sitting with my back to a wall in the cafe.","relate":13},{"who":"W.","text":"A weighted blanket and a show I've seen ten times.","relate":12},{"who":"Anonymous","text":"Telling one person I trust how I've actually been.","relate":15},{"who":"F.","text":"Knowing I could leave whenever I wanted.","relate":11}]},{"q":"What's one gentle thing you can do on a hard day?","a":[{"who":"Anonymous","text":"Make tea and hold the mug until it's cool.","relate":14},{"who":"Y.","text":"Text 'rough day' to a friend without explaining.","relate":12},{"who":"Anonymous","text":"Go somewhere with soft noise, like a library.","relate":10},{"who":"I.","text":"Let myself skip what isn't urgent.","relate":11}]},{"q":"What's something you're proud of, at your own pace?","a":[{"who":"Anonymous","text":"Going back to var TDEF = {}; TUNE.forEach(function (t) { TDEF[t[0]] = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--' + t[0])); });
var TV = {}; try { TV = JSON.parse(localStorage.getItem('soothe-spacing') || '{}') || {}; } catch (e) { TV = {}; }
function applyTune() { TUNE.forEach(function (t) { var v = TV[t[0]]; if (v != null) document.documentElement.style.setProperty('--' + t[0], v + 'px'); else document.documentElement.style.removeProperty('--' + t[0]); }); }
function tuneCss() { return ':root {\n' + TUNE.map(function (t) { return '  --' + t[0] + ': ' + (TV[t[0]] != null ? TV[t[0]] : TDEF[t[0]]) + 'px;'; }).join('\n') + '\n}'; }
var tuneEl = document.getElementById('tune');
function openTune(min) {
  tuneEl.innerHTML = '<div class="tune' + (min ? ' min' : '') + '" role="region" aria-label="Spacing editor"><div class="row between"><b style="font-size:15px">Edit spacing</b><span class="row" style="gap:4px"><button class="chip" style="min-height:32px;background:var(--surface-2)" data-tune="min">' + (min ? 'Open' : 'Hide') + '</button><button class="icon-btn" style="width:32px;height:32px;box-shadow:none;background:var(--surface-2)" data-tune="close" aria-label="Close spacing editor">' + svg(I.x, 14) + '</button></span></div><div class="tune-body">' +
    TUNE.map(function (t) { var v = TV[t[0]] != null ? TV[t[0]] : TDEF[t[0]]; return '<label>' + t[1] + '<span class="val" id="tv-' + t[0] + '">' + v + 'px</span><input type="range" min="' + t[2] + '" max="' + t[3] + '" step="' + t[4] + '" value="' + v + '" data-tune-key="' + t[0] + '"></label>'; }).join('') +
    '<div class="row"><button class="btn small grow" data-tune="copy">Copy values</button><button class="btn small ghost grow" data-tune="reset">Reset</button></div><span class="soft" style="font-size:12px">Changes show on every screen and are saved in this browser only. Copy the values and send them to Claude to make them the default for everyone.</span></div></div>';
  try { localStorage.setItem('soothe-tune-open', min ? 'min' : 'open'); } catch (e) {}
}
tuneEl.addEventListener('input', function (e) { var k = e.target.getAttribute('data-tune-key'); if (!k) return; TV[k] = parseFloat(e.target.value); document.getElementById('tv-' + k).textContent = TV[k] + 'px'; applyTune(); try { localStorage.setItem('soothe-spacing', JSON.stringify(TV)); } catch (x) {} });
tuneEl.addEventListener('click', function (e) {
  var b = e.target.closest('[data-tune]'); if (!b) return; var a = b.getAttribute('data-tune');
  if (a === 'close') { tuneEl.innerHTML = ''; try { localStorage.removeItem('soothe-tune-open'); } catch (x) {} }
  else if (a === 'min') openTune(!tuneEl.querySelector('.tune.min'));
  else if (a === 'reset') { TV = {}; try { localStorage.removeItem('soothe-spacing'); } catch (x) {} applyTune(); openTune(false); }
  else if (a === 'copy') { var css = tuneCss(); try { navigator.clipboard.writeText(css).then(function () { toast('Spacing values copied'); }, function () { prompt('Copy these values', css); }); } catch (x) { toast('Copy failed'); } }
});
try { localStorage.removeItem('soothe-spacing'); localStorage.removeItem('soothe-tune-open'); } catch (e) {}
document.documentElement.setAttribute('data-theme', 'light'); try { localStorage.removeItem('soothe-theme'); } catch (e) {}
var splash = document.getElementById('splash');
function hideSplash() { if (!splash || splash.classList.contains('out')) return; splash.classList.add('out'); setTimeout(function () { if (splash) splash.remove(); splash = null; }, 650); }
if (splash) { splash.addEventListener('click', hideSplash); setTimeout(hideSplash, window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 900 : 2300); }
render();
})();
</script>
